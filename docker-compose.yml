services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_DIALOGUE_URL=http://localhost:8001
      - NEXT_PUBLIC_AAC_URL=http://localhost:8005
      - NEXT_PUBLIC_SESSION_URL=http://localhost:8004
      - NEXT_PUBLIC_PERSONA_URL=http://localhost:8002
      - NEXT_PUBLIC_EXPRESSION_URL=http://localhost:8003
    depends_on:
      - dialogue-engine
      - aac-icon-service
      - session-service
      - expression-service

  dialogue-engine:
    build: ./dialogue-engine
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SECRET_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  aac-icon-service:
    build: ./aac-icon-service
    ports:
      - "8005:8005"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}

  session-service:
    build: ./session-service
    ports:
      - "8004:8004"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=session-videos
    depends_on:
      - redis
      - minio

  persona-engine:
    build: ./persona-engine
    ports:
      - "8002:8002"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}

  expression-service:
    build: ./expression-service
    ports:
      - "8003:8003"
    mem_limit: 2g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

volumes:
  minio_data:
