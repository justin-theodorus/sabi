# ── dialogue-queue-api ────────────────────────────────────────────────────────
# HTTP/SSE server + BullMQ job enqueuer. Fixed replicas — scales on memory
# (each active SSE connection holds a Redis pub/sub subscriber).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogue-queue-api
  namespace: sabi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dialogue-queue-api
  template:
    metadata:
      labels:
        app: dialogue-queue-api
    spec:
      containers:
        - name: dialogue-queue-api
          image: sabi/dialogue-queue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: REDIS_URL
            - name: DIALOGUE_ENGINE_URL
              value: "http://dialogue-engine:8001"
            - name: JOB_TIMEOUT_MS
              value: "150000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dialogue-queue-api
  namespace: sabi
spec:
  selector:
    app: dialogue-queue-api
  ports:
    - port: 8006
      targetPort: 8006
---
# ── dialogue-queue-worker ─────────────────────────────────────────────────────
# BullMQ worker only — no HTTP server. Scaled by KEDA based on queue depth.
# Total max concurrent Claude calls = maxReplicas × WORKER_CONCURRENCY = 3 × 2 = 6
# Adjust both values together to match your Anthropic API tier limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogue-queue-worker
  namespace: sabi
spec:
  replicas: 1           # KEDA takes over replica count at runtime
  selector:
    matchLabels:
      app: dialogue-queue-worker
  template:
    metadata:
      labels:
        app: dialogue-queue-worker
    spec:
      containers:
        - name: dialogue-queue-worker
          image: sabi/dialogue-queue:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "worker.js"]
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: REDIS_URL
            - name: DIALOGUE_ENGINE_URL
              value: "http://dialogue-engine:8001"
            - name: WORKER_CONCURRENCY
              value: "2"        # Per-pod Claude call limit. 3 pods × 2 = 6 total (Tier-2 safe)
            - name: JOB_TIMEOUT_MS
              value: "150000"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
---
# ── KEDA ScaledObject — scale workers on BullMQ queue depth ──────────────────
# Requires KEDA v2.14+ installed in the cluster: https://keda.sh/docs/deploy/
#
# Scaling logic:
#   - 0 waiting jobs  → 0 worker pods (scale to zero, saves cost when idle)
#   - 1–3 waiting     → 1 pod  (handles 2 concurrent jobs, 1 queued)
#   - 4–6 waiting     → 2 pods
#   - 7+ waiting      → 3 pods (max; 6 total Claude calls, within Tier-2 limits)
#
# listLength=3 means KEDA adds 1 replica per 3 waiting+active jobs.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dialogue-worker-scaler
  namespace: sabi
spec:
  scaleTargetRef:
    name: dialogue-queue-worker
  minReplicaCount: 0        # Scale to zero when queue is empty
  maxReplicaCount: 3        # Hard cap — keeps total Claude calls ≤ 6 (Tier-2 safe)
  cooldownPeriod: 30        # Seconds to wait before scaling down after queue drains
  pollingInterval: 10       # Check queue depth every 10s
  triggers:
    - type: bullmq
      metadata:
        queueName: dialogue
        listLength: "3"           # 1 replica per 3 waiting jobs
        activationListLength: "1" # Start first pod when ≥1 job is waiting
        host: redis.sabi.svc.cluster.local
        port: "6379"
