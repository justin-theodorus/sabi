apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogue-engine
  namespace: sabi
spec:
  replicas: 2          # Min replicas; HPA scales up to 8 based on CPU
  # dialogue-queue workers round-robin across pods via K8s ClusterIP service
  selector:
    matchLabels:
      app: dialogue-engine
  template:
    metadata:
      labels:
        app: dialogue-engine
    spec:
      containers:
        - name: dialogue-engine
          image: sabi/dialogue-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: ANTHROPIC_API_KEY
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: ELEVENLABS_API_KEY
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dialogue-engine
  namespace: sabi
spec:
  selector:
    app: dialogue-engine
  ports:
    - port: 8001
      targetPort: 8001
---
# HPA: scale dialogue-engine pods based on CPU utilization
# Ideal metric would be BullMQ queue depth via KEDA, but CPU is a good proxy
# since each active Claude call holds a Python asyncio coroutine + memory.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dialogue-engine-hpa
  namespace: sabi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dialogue-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
