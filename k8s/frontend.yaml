apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sabi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sabi/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_URL
            - name: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_PUBLISHABLE_KEY
            # All API traffic routes through Kong
            - name: NEXT_PUBLIC_DIALOGUE_URL
              value: "http://kong"
            - name: NEXT_PUBLIC_SESSION_URL
              value: "http://kong"
            - name: NEXT_PUBLIC_PERSONA_URL
              value: "http://kong"
            - name: NEXT_PUBLIC_EXPRESSION_URL
              value: "http://kong"
            - name: NEXT_PUBLIC_AAC_URL
              value: "http://kong"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sabi
spec:
  selector:
    app: frontend
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
