apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-engine
  namespace: sabi
spec:
  replicas: 1          # Rules-based, lightweight — 1 replica is sufficient
  selector:
    matchLabels:
      app: persona-engine
  template:
    metadata:
      labels:
        app: persona-engine
    spec:
      containers:
        - name: persona-engine
          image: sabi/persona-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: persona-engine
  namespace: sabi
spec:
  selector:
    app: persona-engine
  ports:
    - port: 8002
      targetPort: 8002
