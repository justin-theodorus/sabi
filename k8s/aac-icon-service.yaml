apiVersion: apps/v1
kind: Deployment
metadata:
  name: aac-icon-service
  namespace: sabi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aac-icon-service
  template:
    metadata:
      labels:
        app: aac-icon-service
    spec:
      containers:
        - name: aac-icon-service
          image: sabi/aac-icon-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aac-icon-service
  namespace: sabi
spec:
  selector:
    app: aac-icon-service
  ports:
    - port: 8005
      targetPort: 8005
