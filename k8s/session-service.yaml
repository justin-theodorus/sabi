apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: sabi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
        - name: session-service
          image: sabi/session-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: SUPABASE_SECRET_KEY
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sabi-secrets
                  key: MINIO_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: REDIS_URL
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: MINIO_PUBLIC_URL
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: sabi-config
                  key: MINIO_BUCKET
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: sabi
spec:
  selector:
    app: session-service
  ports:
    - port: 8004
      targetPort: 8004
